name: Android build and release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build and check APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false

      - name: Restore development signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo '::error::Missing ANDROID_DEBUG_KEYSTORE_BASE64 repository secret.'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/stayput-debug.keystore"
          chmod 600 "$RUNNER_TEMP/stayput-debug.keystore"

      - name: Run core checks
        run: sh tools/test-core.sh

      - name: Build APK and run lint
        run: sh gradlew --no-daemon -PdevelopmentKeystore="$RUNNER_TEMP/stayput-debug.keystore" assembleDebug lintDebug

      - name: Package download
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Stayput.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose dist/Stayput.apk
          keytool -exportcert -keystore "$RUNNER_TEMP/stayput-debug.keystore" \
            -storepass android -alias androiddebugkey > "$RUNNER_TEMP/stayput-signing-cert.der"
          expected=$(sha256sum "$RUNNER_TEMP/stayput-signing-cert.der" | cut -d ' ' -f 1)
          actual=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs dist/Stayput.apk \
            | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          if [ "$actual" != "$expected" ]; then
            echo '::error::APK signing certificate does not match the saved development key.'
            exit 1
          fi
          cd dist
          sha256sum Stayput.apk > SHA256SUMS.txt
          printf 'Commit: %s\nBuild: %s\nRun: https://github.com/%s/actions/runs/%s\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" > build-info.txt

      - name: Upload APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: stayput-apk
          path: dist/
          if-no-files-found: error
          retention-days: 30

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore
          retention-days: 14

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/stayput-debug.keystore" "$RUNNER_TEMP/stayput-signing-cert.der"

  release:
    name: Publish GitHub prerelease
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Download APK
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: stayput-apk
          path: dist

      - name: Verify download checksum
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish APK and build details
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          tag="main-build-${BUILD_NUMBER}"
          cat > release-notes.md <<EOF
          Automated development build from main.

          Download **Stayput.apk** below and open it on your Android phone to install.
          This APK uses the project's development signing key and is intended for testing.
          Core checks and Android lint passed before publication.

          Commit: ${GITHUB_SHA}
          Build log: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          EOF
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release upload "$tag" dist/Stayput.apk dist/SHA256SUMS.txt dist/build-info.txt --clobber
          else
            gh release create "$tag" dist/Stayput.apk dist/SHA256SUMS.txt dist/build-info.txt \
              --target "$GITHUB_SHA" \
              --title "Stayput main build ${BUILD_NUMBER}" \
              --notes-file release-notes.md \
              --prerelease
          fi
          printf '### APK published\n\n[Download Stayput build %s](https://github.com/%s/releases/tag/%s)\n' \
            "$BUILD_NUMBER" "$GITHUB_REPOSITORY" "$tag" >> "$GITHUB_STEP_SUMMARY"
