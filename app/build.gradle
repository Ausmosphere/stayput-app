plugins { id 'com.android.application' }
android {
    namespace 'app.stayput'
    compileSdk 35
    defaultConfig {
        applicationId 'app.stayput'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
        manifestPlaceholders = [glyphApiKey: providers.gradleProperty('glyphApiKey').getOrElse('test')]
        testInstrumentationRunner 'app.stayput.SmokeInstrumentation'
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildTypes { release { minifyEnabled false } }
}
dependencies { implementation files('libs/glyph-matrix-sdk-2.0.aar') }
